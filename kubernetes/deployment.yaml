apiVersion: apps/v1
kind: Deployment

metadata:
  name: cafe-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cafe-app

  template:
    metadata:
      labels:
        app: cafe-app

    spec:
      containers:
      - name: cafe-container
        image: ariba18/cafe-website:3
        ports:
        - containerPort: 80